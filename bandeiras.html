<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bandeiras.css">
</head>
<body>
    <section>
        <h1>França</h1>
            <div class="Franca">
                <div class="fx-azul"></div>
                <div class="fx-branca"></div>
                <div class="fx-vermelha"></div>
            </div>
    </section>
    
    <section>
        <h1>Alemanha</h1>
        <div class="Alemanha">
            <div class="fx-preta"></div>
            <div class="fx-vermelha"></div>
            <div class="fx-amarela"></div>
        </div>
    </section>
    <section>
        <h1>Colombia</h1>
        <div class="Colombia">
            <div class="fx-Colom-amarela"></div>
            <div class="fx-azul"></div>
            <div class="fx-vermelha"></div>
        </div>
    </section>
    <section>
        <h1>Japão</h1>
        <div class="Japao">
            <div class="esfera-vermelha"></div>
        </div>
    </section>
    <section>
        <h1>Emirados Árabes</h1>
        <div class="Emirados">
            <div class="fx-vermelha"></div>
            <div class="box-2">
                <div class="fx-verde"></div>
                <div class="fx-branca"></div>
                <div class="fx-preta"></div>
            </div>
        </div>
    </section>
    <section>
        <h1>Brasil</h1>
        <div class="Brasil">
            <div class="box-verde">
                <div class="fx-Bra-amarela">
                </div>
                <div class="esfera-azul">
                    <div class="fx-brasil"></div>
                </div>
            </div>
        </div>
    </section>
    <section>
        <h1>Suíça</h1>
        <div class="Suica">
            <div class="fx-vermelha-suica">
                <div class="fx-branca-suica"></div>
                <div class="fx-branca-suica-2"></div>
            </div>
        </div>
    </section>
    <section>
        <h1>Jordânia</h1>
        <div class="Jordania">
            <div class="fx-vermelha-jordania">
                <div class="estrela"></div>
            </div>
            <div class="box-2">
                <div class="fx-verde"></div>
                <div class="fx-branca"></div>
                <div class="fx-preta"></div>
            </div>
        </div>    
    </section>
    <section>
        <h1>Trinidad e Tobago</h1>
        <div class="TrinidadTobago">
            <div class="fx-vermelha">
                <div class="fx-preta-TrinidadTobago"></div>
            </div>
        </div>
    </section>
    <section>
        <h1>Turquia</h1>
        <div class="Turquia">
            <div class="fx-vermelha-turquia">
                <div class="lua">
                    <div class="eclipse"></div>
                </div>
                <div class="estrela-turquia"></div>
            </div>
        </div>
    </section>
    <section>
        <h1>Grécia</h1>
        <div class="Grecia">
            <div class="fx-grecia"></div>
            <div class="box-grecia">
                <div class="cross-grecia1"></div>
                <div class="cross-grecia2"></div>
            </div>
        </div>
    </section>
    <section>
        <h1>Chile</h1>
        <div class="Chile">
            <div class="box-chile">
                <div class="fx-azul-chile">
                    <div class="estrela-chile"></div>
                </div>
            </div>
            <div class="fx-vermelha"></div>
        </div>
    </section>
    <section>
        <h1>Estados Unidos</h1>
        <div class="EstadosUnidos">
            <div class="box-eua">
            </div>
        </div>
    </section>
    <script src="bandeiras.js"></script>
</body>
</html>
